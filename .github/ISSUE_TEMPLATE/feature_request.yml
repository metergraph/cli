name: CLI feature request
description: Suggest an agent or developer workflow improvement
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe the general use case without internal tracker or customer details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed CLI behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
