name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-source:
    name: Bundled skill matches metergraph/skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Compare with the pinned commit
        run: node scripts/sync-skill.mjs --check

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Unit and subprocess tests
        run: npm test

      - name: Packed install smoke test
        run: npm run test:package

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # The parity tests run the npm CLI against the Python installer.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Unit and subprocess tests
        run: |
          python -m unittest discover -s python/metergraph-skills/tests -v
          python scripts/test_publication.py

  python-dist:
    name: Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned build tools
        run: python -m pip install --require-hashes --no-deps -r python/requirements-build.txt

      - name: Build and check every package
        run: |
          set -euo pipefail
          for DIR in python/metergraph-skills python/placeholders/*; do
            OUT="$RUNNER_TEMP/dist/$(basename "$DIR")"
            python -m build --no-isolation --outdir "$OUT" "$DIR"
            python scripts/check_python_dist.py "$DIR" "$OUT"
          done

  pricing:
    name: Pricing reference with real core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out CLI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out pinned public core 0.5.0
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PioneerSquareLabs/metergraph
          ref: 62fb9fcee7e49280f924d7c1ccfbc37f442555a4
          path: .pricing-core
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install isolated core engine
        run: |
          python -m venv "$RUNNER_TEMP/pricing-venv"
          "$RUNNER_TEMP/pricing-venv/bin/python" -m pip install ./.pricing-core/core
      - name: Run source and packed CLI against real core
        run: |
          PRICING_PYTHON="$RUNNER_TEMP/pricing-venv/bin/python" node scripts/pricing-smoke.mjs
          mkdir -p "$RUNNER_TEMP/pricing-pack"
          npm pack --pack-destination "$RUNNER_TEMP/pricing-pack"
          npm install --prefix "$RUNNER_TEMP/pricing-install" "$RUNNER_TEMP"/pricing-pack/*.tgz --no-audit --no-fund
          PRICING_PYTHON="$RUNNER_TEMP/pricing-venv/bin/python" \
            PRICING_BIN="$RUNNER_TEMP/pricing-install/node_modules/metergraph-cli/bin/metergraph.js" \
            node scripts/pricing-smoke.mjs
